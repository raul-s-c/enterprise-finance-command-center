<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Enterprise Finance Command Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1220'/%3E%3Ctext x='32' y='41' font-size='25' text-anchor='middle' fill='%23ffffff' font-family='Arial'%3EAF%3C/text%3E%3C/svg%3E">

</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AF</div>
        <div>
          <div class="brand-name">Aureon Finance</div>
          <div class="brand-sub">Command Center</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div id="closeStatus" class="close-status">Loading close...</div>
        <a href="https://github.com/raul-s-c/enterprise-finance-command-center" target="_blank" rel="noreferrer">Repository</a>
      </div>
    </aside>

    <main class="main-shell">
      <div class="global-bar">
        <label class="global-search" aria-label="Search reports">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input id="globalSearch" type="search" placeholder="Search reports, entities, customers, accounts..." autocomplete="off">
        </label>
        <div class="global-utilities">
          <strong id="globalPeriod">2026-08</strong>
          <span id="globalControl" class="global-control"><i></i> Controls passed</span>
          <button id="globalExport" class="utility-button" type="button" title="Export current view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 13v7h14v-7"></path></svg><span>Export</span>
          </button>
          <button id="globalHelp" class="utility-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.8 9a2.4 2.4 0 0 1 4.7.7c0 2-2.5 2.1-2.5 4.1M12 17.5h.01"></path></svg><span>Help</span>
          </button>
          <span class="user-avatar" aria-hidden="true">AF</span>
          <span class="user-name">Finance Director</span>
        </div>
      </div>
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Executive</h1>
          <p id="viewSubtitle">Group performance, cash conversion and forward outlook.</p>
        </div>
        <div class="filters">
          <label>Entity<select id="entityFilter"><option value="all">All entities</option></select></label>
          <label>Division<select id="divisionFilter"><option value="all">All divisions</option></select></label>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <script src="app.js?v=0.21.0-lineage"></script>
