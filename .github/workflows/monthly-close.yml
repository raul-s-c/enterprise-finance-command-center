name: Monthly Finance Close

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 2 * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/processed/**"
      - "web/data/**"
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: enterprise-finance-close-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.cjs
      - run: pytest -m 'not integration'
      - run: python -m enterprise_finance.cli build
      - name: Stage validated close candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: finance-close-candidate
          path: |
            data/processed
            web
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, continuity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve validated close candidate
        uses: actions/download-artifact@v4
        with:
          name: finance-close-candidate
          path: .
      - name: Reject superseded source revision
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "Source revision is no longer main; refusing to publish stale finance data."
            exit 1
          }
      - name: Commit generated finance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed web/data
          git diff --cached --quiet || git commit -m "data: monthly synthetic finance close"
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [publish]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
