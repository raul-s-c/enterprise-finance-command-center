name: Monthly Finance Close

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 2 * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: python -m enterprise_finance.cli build
      - name: Commit generated finance data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed web/data
          git diff --cached --quiet || git commit -m "data: monthly synthetic finance close"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
